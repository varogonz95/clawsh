name: claude

# Claude reviews every PR (on open, on each push, and when it leaves draft)
# with inline comments, reviews again when a PR is assigned to Claude (drafts
# too), and answers "@claude ..." in PR/issue comments.
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`, then add
# it under Settings > Secrets and variables > Actions) and the Claude GitHub
# App installed on the repo (https://github.com/apps/claude).
# PRs from forks get no secrets, so they aren't reviewed; nor are PRs opened
# with GITHUB_TOKEN (the release PRs), which start no workflows.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    if: |
      github.event_name == 'pull_request' && (
        (github.event.action == 'assigned' && github.event.assignee.login == 'Claude') ||
        (github.event.action != 'assigned' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the rules in CLAUDE.md. Focus on
            correctness bugs, security, and breaks of the project's rules
            (cross-platform builds, the single-writer websocket pattern, docs
            kept up to date). Skip style nits a formatter would catch.

            Post each finding as an inline comment on the line it's about with
            mcp__github_inline_comment__create_inline_comment, then one short
            summary with `gh pr comment`. If there's nothing worth changing,
            say so in one line. Don't add attribution footers or session links.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

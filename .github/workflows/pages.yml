name: pages

# Builds the site (site/ plus docs/wiki/ rendered under docs/, see
# scripts/docs/build.mjs) and deploys it to GitHub Pages from main. Pull
# requests only build, so a broken docs link fails the PR, not the deploy.
# The header shows the newest release tag, so release.yml dispatches this
# after publishing one.

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/wiki/**", "scripts/docs/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "docs/wiki/**", "scripts/docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for the release label
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/docs/build.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4

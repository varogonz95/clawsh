name: release-cut

# Cuts a release: tags a commit on main as v<version>, which starts release.yml
# (build, GitHub release, npm). Run it from the Actions tab or the CLI:
#   gh workflow run release-cut.yml                      # tip of main, version computed
#   gh workflow run release-cut.yml -f ref=<sha>         # up to that commit
#   gh workflow run release-cut.yml -f bump=minor        # force the bump
#   gh workflow run release-cut.yml -f version=0.4.0-rc.1
#
# The version is computed from the last stable release on main and the product
# commits since then (paths in .github/product-paths), read as conventional
# commits: a breaking change ("feat!:", "BREAKING CHANGE") bumps the major
# (the minor while still on 0.x), a "feat" the minor, anything else the patch.
# Nothing is committed: the version lives only in the tag, so main (which only
# takes pull requests) is never touched.
#
# Needs a secret RELEASE_TOKEN in the `releases` environment (Settings >
# Environments; the job runs in it, so main must be allowed to deploy there):
# a fine-grained PAT with Contents: read and write. Tags pushed with the default
# GITHUB_TOKEN don't start other workflows, so release.yml would never run.
# To patch an older release, use release-hotfix.yml.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit on main to release (SHA). Empty: the tip of main"
        required: false
        type: string
      bump:
        description: "How to bump the last release. auto: from the commit messages"
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      version:
        description: "Exact version instead (no v): 0.4.0, or 0.4.0-rc.1 for a pre-release"
        required: false
        type: string
      allow_non_product:
        description: "Release even if nothing since the last release touches a path in .github/product-paths"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Shared with release-hotfix.yml: one release runs at a time.
concurrency:
  group: release-dispatch

jobs:
  cut:
    runs-on: ubuntu-latest
    environment: releases
    env:
      REF: ${{ inputs.ref }}
      BUMP: ${{ inputs.bump }}
      VERSION: ${{ inputs.version }}
      ALLOW_NON_PRODUCT: ${{ inputs.allow_non_product }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check token
        run: |
          if [[ -z $RELEASE_TOKEN ]]; then
            echo "::error::Secret RELEASE_TOKEN is not set (see the header of release-cut.yml)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Pick the commit and the version
        run: |
          set -euo pipefail
          source scripts/release/lib.sh
          sha=$(git rev-parse --verify "${REF:-origin/main}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main"
            exit 1
          fi

          # The last stable release in main's history and what changed since.
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "$sha" 2>/dev/null || true)
          mapfile -t paths < <(grep -v '^#' .github/product-paths | grep .)
          range=${prev:+$prev..}$sha
          if [[ -n $prev && $(git rev-parse "$prev^{commit}") == "$sha" ]]; then
            echo "::error::${sha:0:7} is already released as $prev"
            exit 1
          fi
          product=$(git log --format='%H' "$range" -- "${paths[@]}")
          if [[ -n $prev && -z $product && $ALLOW_NON_PRODUCT != true ]]; then
            echo "::error::No product change since $prev (paths in .github/product-paths). Tick allow_non_product to release anyway."
            exit 1
          fi

          if [[ -n $VERSION ]]; then
            VERSION=${VERSION#v}
          else
            last=${prev#v}
            last=${last:-0.0.0}
            if [[ $BUMP == auto ]]; then
              BUMP=patch
              # Product commits only: a docs-only "feat" doesn't make a minor.
              for c in ${product:-$(git rev-list "$range")}; do
                msg=$(git log -1 --format='%s%n%b' "$c")
                if [[ $msg =~ ^[a-z]+(\([^\)]*\))?!: || $msg == *"BREAKING CHANGE"* ]]; then
                  BUMP=major; break
                elif [[ $msg =~ ^feat(\([^\)]*\))?: ]]; then
                  BUMP=minor
                fi
              done
              # Before 1.0 a breaking change bumps the minor.
              [[ $BUMP == major && ${last%%.*} == 0 ]] && BUMP=minor
            fi
            VERSION=$(next_version "$last" "$BUMP")
          fi
          if [[ ! $VERSION =~ $SEMVER_RE ]]; then
            echo "::error::'$VERSION' is not a semantic version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          highest=$(highest_stable)
          if [[ -n $highest ]] && ! version_gt "$VERSION" "$highest"; then
            echo "::error::$VERSION is not newer than the latest release v$highest. To patch an older line, use release-hotfix.yml"
            exit 1
          fi
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "PREV=${prev:-none}" >> "$GITHUB_ENV"

      - name: Tag and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "clawsh $TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          {
            echo "### Tagged $TAG"
            echo "Commit \`${SHA:0:7}\` (previous release: $PREV). [release.yml](../../actions/workflows/release.yml) is building and publishing it."
          } >> "$GITHUB_STEP_SUMMARY"

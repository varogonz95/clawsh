name: release-prepare

# Cuts a release of main from the Actions tab or the CLI:
#   gh workflow run release-prepare.yml -f version=0.2.0 [-f ref=<sha on main>]
# main only takes changes through pull requests, so this runs in two halves:
# 1. This workflow bumps plugin/.claude-plugin/plugin.json on top of the chosen
#    commit, pushes that as release-bump/v<version> and opens a PR into main.
# 2. Merging that PR with a merge commit (not squash or rebase, which would
#    leave the bump commit out of main's history) starts release-tag.yml, which
#    tags the bump commit; the tag starts release.yml.
# If plugin.json already has the version, there's nothing to merge and the
# chosen commit is tagged right away. To patch an older release, use
# release-hotfix.yml.
#
# Needs a secret RELEASE_TOKEN in the `releases` environment (Settings >
# Environments; the job runs in it, so main must be allowed to deploy there):
# a fine-grained PAT with Contents: read and write, to push the release-bump
# branch and the tag. Tags pushed with the default GITHUB_TOKEN don't trigger
# other workflows, so release.yml would never run. The PR itself is opened with
# GITHUB_TOKEN, so that you, not the token's owner, can approve it; that needs
# Settings > Actions > General > "Allow GitHub Actions to create and approve
# pull requests".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v: 0.2.0, or 0.2.0-rc.1 for a pre-release"
        required: true
        type: string
      ref:
        description: "Commit on main to release (SHA). Empty: the tip of main"
        required: false
        type: string
      allow_non_product:
        description: "Release even if nothing since the last release touches a path in .github/product-paths"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write # open the release PR with GITHUB_TOKEN

# Shared with release-hotfix.yml: one release runs at a time and at most one
# waits; a newer dispatch cancels the waiting one, so dispatch the next release
# after the previous run finishes.
concurrency:
  group: release-dispatch

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: releases
    env:
      VERSION: ${{ inputs.version }}
      REF: ${{ inputs.ref }}
      ALLOW_NON_PRODUCT: ${{ inputs.allow_non_product }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check token
        run: |
          if [[ -z $RELEASE_TOKEN ]]; then
            echo "::error::Secret RELEASE_TOKEN is not set (see the header of release-prepare.yml)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Resolve commit
        run: |
          set -euo pipefail
          cp scripts/release/lib.sh "$RUNNER_TEMP/lib.sh"
          source "$RUNNER_TEMP/lib.sh"

          if [[ ! $VERSION =~ $SEMVER_RE ]]; then
            echo "::error::'$VERSION' is not a semantic version like 1.2.3 or 1.2.3-rc.1 (no leading v)"
            exit 1
          fi
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          # Two release PRs would both bump plugin.json and the second would conflict.
          pending=$(git ls-remote --heads origin 'release-bump/*' | sed 's|.*refs/heads/||')
          if [[ -n $pending ]]; then
            echo "::error::A release PR is still open ($pending). Merge it, or close it and delete the branch, then run this again."
            exit 1
          fi
          highest=$(highest_stable)
          if [[ -n $highest ]] && ! version_gt "$VERSION" "$highest"; then
            echo "::error::$VERSION is not newer than the latest release v$highest. To patch an older line, use release-hotfix.yml"
            exit 1
          fi

          sha=$(git rev-parse --verify "${REF:-origin/main}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main"
            exit 1
          fi

          # The last stable release in main's history. Releases are merged into main
          # below, so their tags stay reachable from it.
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' origin/main 2>/dev/null || true)
          if [[ -n $prev ]]; then
            if [[ $(git rev-parse "$prev^{commit}") == "$sha" ]] || ! git merge-base --is-ancestor "$prev" "$sha"; then
              echo "::error::${sha:0:7} is not newer than the last release $prev. Pick a later commit, or use release-hotfix.yml"
              exit 1
            fi
            # Docs, site and workflow changes don't need a release: require a product
            # change. plugin.json is left out because release bumps alone change it.
            if [[ $ALLOW_NON_PRODUCT != true ]]; then
              mapfile -t paths < <(grep -v '^#' .github/product-paths | grep .)
              if [[ -z $(git diff --name-only "$prev" "$sha" -- "${paths[@]}" ':(exclude)plugin/.claude-plugin/plugin.json') ]]; then
                echo "::error::No product change between $prev and ${sha:0:7} (paths in .github/product-paths). Tick allow_non_product to release anyway."
                exit 1
              fi
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - name: Bump and open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --detach "$SHA"

          bump_plugin "$VERSION"
          if git diff --quiet; then
            # Nothing to merge: SHA is on main already, so tag it now.
            git tag -a "$TAG" -m "clawsh $TAG" "$SHA"
            if ! git push origin "refs/tags/$TAG"; then
              echo "::error::Pushing $TAG failed: it was created meanwhile, or RELEASE_TOKEN can't push tags."
              exit 1
            fi
            {
              echo "### Tagged $TAG"
              echo "plugin.json is already at $VERSION, so \`${SHA:0:7}\` was tagged as it is. [release.yml](../../actions/workflows/release.yml) is publishing it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The base is recorded so release-tag.yml can tell a merge commit
          # (which keeps this commit as is) from a squash or rebase (which doesn't).
          git commit -qam "release: $TAG" -m "Release-Base: $SHA"
          branch="release-bump/$TAG"
          git push origin "HEAD:refs/heads/$branch"

          body="Bumps \`plugin.json\` to $VERSION on top of ${SHA}.

          **Merge with \"Create a merge commit\".** Merging starts [release-tag.yml]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/.github/workflows/release-tag.yml), which tags the bump commit as \`$TAG\` and so starts the release. A squash or rebase merge rewrites the bump commit, so nothing gets tagged.

          To cancel the release, close this PR and delete the branch."
          if ! url=$(gh pr create --base main --head "$branch" --title "release: $TAG" --body "$body"); then
            echo "::error::Pushed $branch but could not open the PR (is \"Allow GitHub Actions to create and approve pull requests\" on?). Open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch"
            exit 1
          fi
          {
            echo "### Release PR for $TAG"
            echo "Commit \`$(git rev-parse --short HEAD)\` (based on \`${SHA:0:7}\`): $url"
            echo
            echo "Merge it with a merge commit to tag and publish $TAG."
          } >> "$GITHUB_STEP_SUMMARY"

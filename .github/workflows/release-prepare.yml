name: release-prepare

# Cuts a release from the Actions tab or the CLI:
#   gh workflow run release-prepare.yml -f version=0.2.0 [-f ref=<sha on main>]
# It bumps plugin/.claude-plugin/plugin.json on top of the chosen commit,
# tags the result and pushes the tag, which starts release.yml.
#
# Needs a repository secret RELEASE_TOKEN: a token that can push to this repo
# (fine-grained PAT with Contents: read and write). Tags pushed with the
# default GITHUB_TOKEN don't trigger other workflows, so release.yml would
# never run. If the token can't push to main, the tag is still created and
# the plugin.json bump has to be landed by hand.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v: 0.2.0, or 0.2.0-rc.1 for a pre-release"
        required: true
        type: string
      ref:
        description: "Commit on main to release (SHA). Empty: the tip of main"
        required: false
        type: string
      allow_non_product:
        description: "Release even if nothing since the last tag touches a path in .github/product-paths"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-prepare

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      REF: ${{ inputs.ref }}
      ALLOW_NON_PRODUCT: ${{ inputs.allow_non_product }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Check inputs
        run: |
          if [[ -z $RELEASE_TOKEN ]]; then
            echo "::error::Secret RELEASE_TOKEN is not set (see the header of release-prepare.yml)"
            exit 1
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! $VERSION =~ $semver ]]; then
            echo "::error::'$VERSION' is not a semantic version like 1.2.3 or 1.2.3-rc.1 (no leading v)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Resolve commit
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          sha=$(git rev-parse --verify "${REF:-origin/main}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main"
            exit 1
          fi
          # Docs, site and workflow changes don't need a release: require a product change.
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$sha" 2>/dev/null || true)
          if [[ -n $prev && $ALLOW_NON_PRODUCT != true ]]; then
            mapfile -t paths < <(grep -v '^#' .github/product-paths | grep .)
            if [[ -z $(git diff --name-only "$prev" "$sha" -- "${paths[@]}") ]]; then
              echo "::error::No product change between $prev and ${sha:0:7} (paths in .github/product-paths). Tick allow_non_product to release anyway."
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - name: Bump, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --detach "$SHA"

          # sed keeps the file's hand-formatted layout; VERSION is validated above.
          sed -i -E "s/(\"version\": \")[^\"]*(\")/\1${VERSION}\2/" plugin/.claude-plugin/plugin.json
          jq -e --arg v "$VERSION" '.version == $v' plugin/.claude-plugin/plugin.json >/dev/null

          if git diff --quiet; then
            release=$SHA
          else
            git commit -qam "release: $TAG"
            release=$(git rev-parse HEAD)
          fi
          git tag -a "$TAG" -m "clawsh $TAG" "$release"
          git push origin "refs/tags/$TAG"

          # Put the bump on main too. Not fatal: the tag is already out.
          if [[ $release != "$SHA" ]]; then
            git checkout -q main
            if git cherry-pick --ff "$release" >/dev/null && git push origin main; then
              echo "Bump landed on main"
            else
              git cherry-pick --abort 2>/dev/null || true
              echo "::warning::Could not push the plugin.json bump to main; open a PR with version $VERSION"
            fi
          fi

          {
            echo "### Tagged $TAG"
            echo "Commit \`${release:0:7}\` (based on \`${SHA:0:7}\`). [release.yml](../../actions/workflows/release.yml) is publishing it."
          } >> "$GITHUB_STEP_SUMMARY"

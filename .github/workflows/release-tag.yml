name: release-tag

# Second half of release-prepare.yml: when its release PR (release-bump/v<version>)
# is merged into main, this tags the PR's bump commit, which starts release.yml.
# The bump commit is recognized by its subject ("release: v<version>") and its
# Release-Base trailer; it must still sit on that base, which only a merge
# commit keeps. A squash or rebase merge is reported and nothing is tagged.
#
# Tagging needs the RELEASE_TOKEN secret from the `releases` environment (see
# release-prepare.yml), because tags pushed with GITHUB_TOKEN don't start
# release.yml. Only runs that find a release commit enter the environment.

on:
  push:
    branches: [main]
    paths: ["plugin/.claude-plugin/plugin.json"]

permissions:
  contents: read

concurrency:
  group: release-tag

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.find.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find merged release commits
        id: find
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          source scripts/release/lib.sh
          release_re='^release: v([^ ]+)$'
          squash_re='^release: v([^ ]+) \(#[0-9]+\)$'
          releases=()
          if [[ ! $BEFORE =~ ^0+$ ]]; then
            while IFS=$'\t' read -r c subject; do
              if [[ $subject =~ $squash_re ]]; then
                echo "::error::${c:0:7} is a release PR merged by squash, so nothing was tagged (release PRs need a merge commit). main's plugin.json now has ${BASH_REMATCH[1]}: delete release-bump/v${BASH_REMATCH[1]} if it's still there, then run release-prepare again with that version and no ref to tag main's tip as it is."
                exit 1
              fi
              [[ $subject =~ $release_re ]] || continue
              version=${BASH_REMATCH[1]}
              [[ $version =~ $SEMVER_RE ]] || continue
              if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                echo "::notice::v$version already exists; skipping ${c:0:7}"
                continue
              fi
              base=$(git log -1 --format='%(trailers:key=Release-Base,valueonly)' "$c" | head -1)
              if [[ -z $base ]]; then
                echo "::warning::${c:0:7} ($subject) has no Release-Base trailer, so it wasn't made by release-prepare; not tagging it."
                continue
              fi
              if [[ $(git rev-parse "$c^1") != "$base" ]]; then
                echo "::error::${c:0:7} ($subject) no longer sits on ${base:0:7}: the release PR was rebased, so nothing was tagged (release PRs need a merge commit). Delete release-bump/v$version if it's still there, then run release-prepare again for $version with no ref to tag main's tip as it is."
                exit 1
              fi
              plugin=$(git show "$c:plugin/.claude-plugin/plugin.json" | jq -r .version)
              if [[ $plugin != "$version" ]]; then
                echo "::error::${c:0:7} ($subject) has plugin.json at $plugin; not tagging it."
                exit 1
              fi
              releases+=("$c:$version")
            done < <(git log --reverse --format='%H%x09%s' "$BEFORE..$AFTER")
          fi
          echo "releases=${releases[*]}" >> "$GITHUB_OUTPUT"

  tag:
    needs: find
    if: needs.find.outputs.releases != ''
    runs-on: ubuntu-latest
    environment: releases
    env:
      RELEASES: ${{ needs.find.outputs.releases }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check token
        run: |
          if [[ -z $RELEASE_TOKEN ]]; then
            echo "::error::Secret RELEASE_TOKEN is not set (see the header of release-prepare.yml)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Tag and push
        run: |
          set -euo pipefail
          source scripts/release/lib.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for r in $RELEASES; do
            c=${r%%:*} version=${r#*:}
            tag="v$version"
            # Another release may have landed since release-prepare checked.
            highest=$(highest_stable)
            if [[ -n $highest ]] && ! version_gt "$version" "$highest"; then
              echo "::error::$version is no longer newer than the latest release v$highest; ${c:0:7} was not tagged."
              exit 1
            fi
            git tag -a "$tag" -m "clawsh $tag" "$c"
            git push origin "refs/tags/$tag"
            git push -q origin --delete "release-bump/$tag" 2>/dev/null || true
            {
              echo "### Tagged $tag"
              echo "Commit \`${c:0:7}\`. [release.yml](../../actions/workflows/release.yml) is publishing it."
            } >> "$GITHUB_STEP_SUMMARY"
          done

name: release-tag

# Second half of release-prepare.yml: when its release PR (release-bump/v<version>)
# is merged into main, this tags the release, which starts release.yml.
# The bump commit is recognized by its subject ("release: v<version>", or
# "release: v<version> (#<pr>)" when squashed) and its Release-Base trailer.
# A merge commit keeps the bump commit on that base, so the tag holds exactly
# the chosen commit plus the bump. A squash or rebase puts it on main as it was
# at merge time, which (main requiring up-to-date branches) often includes
# commits merged after release-prepare ran; it is tagged when those commits
# change nothing under .github/product-paths, so the release still ships the
# chosen product code. Otherwise it is reported and nothing is tagged.
#
# It runs on every push to main, not only ones that change plugin.json: a
# release PR merged after main already got the version (say, after a squashed
# one) changes nothing there but still has to be tagged.
#
# Tagging needs the RELEASE_TOKEN secret from the `releases` environment (see
# release-prepare.yml), because tags pushed with GITHUB_TOKEN don't start
# release.yml. Only runs that find a release commit enter the environment.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-tag

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.find.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find merged release commits
        id: find
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          source scripts/release/lib.sh
          # A squash merge appends " (#<pr>)" to the subject.
          release_re='^release: v([^ ]+)( \(#[0-9]+\))?$'
          releases=()
          mapfile -t product_paths < <(grep -v '^#' .github/product-paths | grep .)
          if [[ ! $BEFORE =~ ^0+$ ]]; then
            while IFS=$'\t' read -r c subject; do
              [[ $subject =~ $release_re ]] || continue
              version=${BASH_REMATCH[1]}
              [[ $version =~ $SEMVER_RE ]] || continue
              if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                echo "::notice::v$version already exists; skipping ${c:0:7}"
                continue
              fi
              if [[ " ${releases[*]} " == *":$version "* ]]; then
                echo "::notice::v$version is already being tagged; skipping ${c:0:7}"
                continue
              fi
              # Read from the body, not as a git trailer: a squash merge appends a
              # Co-authored-by paragraph after it.
              base=$(git log -1 --format=%b "$c" | sed -n -E 's/^Release-Base: *([0-9a-f]{40}) *$/\1/p' | head -1)
              if [[ -z $base ]]; then
                echo "::warning::${c:0:7} ($subject) has no Release-Base trailer, so it wasn't made by release-prepare; not tagging it."
                continue
              fi
              # A squash or rebase merge puts the bump on top of main as it was at
              # merge time. Commits merged after the base are fine as long as
              # none of them changes the product; otherwise tagging would ship
              # product changes that weren't chosen.
              parent=$(git rev-parse "$c^1")
              if [[ $parent != "$base" ]]; then
                if ! git merge-base --is-ancestor "$base" "$parent"; then
                  echo "::error::${c:0:7} ($subject) doesn't sit on top of the chosen ${base:0:7}, so nothing was tagged. Delete release-bump/v$version if it's still there, then run release-prepare for $version with ref ${c:0:7} to release main as of this merge, or with no ref to release main's tip."
                  exit 1
                fi
                product=$(git log --format='%h %s' "$base..$parent" -- "${product_paths[@]}" ':(exclude)plugin/.claude-plugin/plugin.json')
                if [[ -n $product ]]; then
                  echo "::error::${c:0:7} ($subject) was squashed or rebased onto product changes merged after the chosen ${base:0:7}, so nothing was tagged (a merge commit avoids this): $(tr '\n' ';' <<< "$product") main's plugin.json now has $version: delete release-bump/v$version if it's still there, then run release-prepare for $version with ref ${c:0:7} to release main as of this merge, or with no ref to release main's tip."
                  exit 1
                fi
                echo "::notice::${c:0:7} ($subject) sits on commits merged after ${base:0:7}, none of them product changes; tagging it."
              fi
              plugin=$(git show "$c:plugin/.claude-plugin/plugin.json" | jq -r .version)
              if [[ $plugin != "$version" ]]; then
                echo "::error::${c:0:7} ($subject) has plugin.json at $plugin; not tagging it."
                exit 1
              fi
              releases+=("$c:$version")
            done < <(git log --reverse --format='%H%x09%s' "$BEFORE..$AFTER")
          fi
          echo "releases=${releases[*]}" >> "$GITHUB_OUTPUT"

  tag:
    needs: find
    if: needs.find.outputs.releases != ''
    runs-on: ubuntu-latest
    environment: releases
    env:
      RELEASES: ${{ needs.find.outputs.releases }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check token
        run: |
          if [[ -z $RELEASE_TOKEN ]]; then
            echo "::error::Secret RELEASE_TOKEN is not set (see the header of release-prepare.yml)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Tag and push
        run: |
          set -euo pipefail
          source scripts/release/lib.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for r in $RELEASES; do
            c=${r%%:*} version=${r#*:}
            tag="v$version"
            # Another release may have landed since release-prepare checked.
            highest=$(highest_stable)
            if [[ -n $highest ]] && ! version_gt "$version" "$highest"; then
              echo "::error::$version is no longer newer than the latest release v$highest; ${c:0:7} was not tagged."
              exit 1
            fi
            git tag -a "$tag" -m "clawsh $tag" "$c"
            git push origin "refs/tags/$tag"
            git push -q origin --delete "release-bump/$tag" 2>/dev/null || true
            {
              echo "### Tagged $tag"
              echo "Commit \`${c:0:7}\`. [release.yml](../../actions/workflows/release.yml) is publishing it."
            } >> "$GITHUB_STEP_SUMMARY"
          done

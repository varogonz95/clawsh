name: release

# Push a tag to publish: git tag v0.1.0 && git push origin v0.1.0
# Tags with a suffix (v0.1.0-rc.1) become pre-releases (npm dist-tag "next").
# npm publishing uses trusted publishing (OIDC): no token secret; each package
# must list this repo and workflow as a trusted publisher on npmjs.com.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check plugin version
        run: |
          plugin=$(jq -r .version plugin/.claude-plugin/plugin.json)
          if [[ $plugin != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error file=plugin/.claude-plugin/plugin.json::version is $plugin, tag is $GITHUB_REF_NAME; bump it before tagging"
            exit 1
          fi

      - name: Build
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # One archive per platform, each unpacking into its own directory:
      # clawsh_<version>_<os>_<arch>/{clawsh[.exe],README.md,LICENSE}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir -p out
          for f in dist/clawsh-*; do
            target=$(basename "$f" .exe)       # clawsh-linux-amd64
            target=${target#clawsh-}              # linux-amd64
            name="clawsh_${version}_${target//-/_}"
            ext=; [[ $f == *.exe ]] && ext=.exe
            mkdir "$work/$name"
            install -m 755 "$f" "$work/$name/clawsh$ext"
            cp README.md LICENSE "$work/$name/"
            if [[ $ext == .exe ]]; then
              (cd "$work" && zip -qr "$OLDPWD/out/$name.zip" "$name")
            else
              tar -C "$work" -czf "out/$name.tar.gz" "$name"
            fi
          done
          (cd out && sha256sum * > checksums.txt)
          ls -l out

      # A release already made for the tag (e.g. by hand in the UI) keeps its
      # title and notes; the assets are uploaded to it, replacing any of the same name.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
            exit 0
          fi
          flags=()
          [[ $GITHUB_REF_NAME == *-* ]] && flags+=(--prerelease)
          # A hotfix on an older line (release/0.1 after 0.2.0) must not become "Latest".
          highest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | grep -v -- - | sort -V | tail -1)
          [[ $(printf '%s\n%s\n' "${GITHUB_REF_NAME#v}" "$highest" | sort -V | tail -1) != "${GITHUB_REF_NAME#v}" ]] && flags+=(--latest=false)
          gh release create "$GITHUB_REF_NAME" out/* \
            --verify-tag --generate-notes --title "clawsh ${GITHUB_REF_NAME}" "${flags[@]}"

  # The same binaries as the GitHub release, as npm packages: one per platform
  # (clawsh-<os>-<cpu>) plus the "clawsh" launcher that depends on them.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5 for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Stage packages
        run: node npm/build.mjs "${GITHUB_REF_NAME#v}" dist out/npm

      # Platform packages first, so the launcher never points at a missing one.
      # Versions already on npm are skipped, so a re-run finishes the job.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest; [[ $version == *-* ]] && tag=next
          # A hotfix on an older line gets its own dist-tag so "latest" stays on the newest release.
          highest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | grep -v -- - | sort -V | tail -1)
          if [[ $tag == latest && $(printf '%s\n%s\n' "$version" "$highest" | sort -V | tail -1) != "$version" ]]; then
            tag="release-$(echo "$version" | cut -d. -f1,2)"
          fi
          for dir in out/npm/clawsh-*/ out/npm/clawsh/; do
            name=$(jq -r .name "$dir/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            npm publish "$dir" --access public --tag "$tag"
          done

name: release

# Push a tag to publish: git tag v0.1.0 && git push origin v0.1.0
# Tags with a suffix (v0.1.0-rc.1) become pre-releases (npm dist-tag "next").
# npm publishing uses trusted publishing (OIDC): no token secret; each package
# must list this repo and workflow as a trusted publisher on npmjs.com.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check plugin version
        run: |
          plugin=$(jq -r .version plugin/.claude-plugin/plugin.json)
          if [[ $plugin != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error file=plugin/.claude-plugin/plugin.json::version is $plugin, tag is $GITHUB_REF_NAME; bump it before tagging"
            exit 1
          fi

      - name: Build
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # One archive per platform, each unpacking into its own directory:
      # clawsh_<version>_<os>_<arch>/{clawsh[.exe],README.md,LICENSE}
      # plus the raw binaries (clawsh-<os>-<arch>[.exe]), which the npm
      # launcher downloads on first run.
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir -p out
          for f in dist/clawsh-*; do
            target=$(basename "$f" .exe)       # clawsh-linux-amd64
            target=${target#clawsh-}              # linux-amd64
            name="clawsh_${version}_${target//-/_}"
            ext=; [[ $f == *.exe ]] && ext=.exe
            mkdir "$work/$name"
            install -m 755 "$f" "$work/$name/clawsh$ext"
            cp README.md LICENSE "$work/$name/"
            if [[ $ext == .exe ]]; then
              (cd "$work" && zip -qr "$OLDPWD/out/$name.zip" "$name")
            else
              tar -C "$work" -czf "out/$name.tar.gz" "$name"
            fi
          done
          cp dist/clawsh-* out/
          (cd out && sha256sum * > checksums.txt)
          ls -l out

      # A release already made for the tag (e.g. by hand in the UI) keeps its
      # title and notes; the assets are uploaded to it, replacing any of the same name.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
            exit 0
          fi
          flags=()
          [[ $GITHUB_REF_NAME == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" out/* \
            --verify-tag --generate-notes --title "clawsh ${GITHUB_REF_NAME}" "${flags[@]}"

  # The "clawsh" npm launcher. It carries the SHA-256 of every binary and
  # downloads its platform's one from the release above on first run, so it
  # must publish after the release assets are up.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5 for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Stage package
        run: node npm/build.mjs "${GITHUB_REF_NAME#v}" dist out/npm

      # A version already on npm is skipped, so re-running the job is safe.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest; [[ $version == *-* ]] && tag=next
          if npm view "clawsh@$version" version >/dev/null 2>&1; then
            echo "clawsh@$version is already published, skipping"
            exit 0
          fi
          npm publish out/npm/clawsh/ --access public --tag "$tag"
